name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, conversation content, WAL data, and private logs.
        Report security vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or release version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and Rust version.
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Deployment topology
      description: Describe client, sidecar, gateway, and runtime placement without secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed all credentials and sensitive conversation or WAL content.
          required: true
        - label: This is not a privately reportable security vulnerability.
          required: true
