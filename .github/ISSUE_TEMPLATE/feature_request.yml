name: Feature request
description: Propose a focused protocol, sidecar, or tooling improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interface and expected result.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Protocol and operational impact
      description: Cover compatibility, persistence, security, topology, and performance.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
